name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Package extension
        run: pnpm package
      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath dotenv-shift-*.vsix -p ${{ secrets.VSCE_PAT }}
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dotenv-shift-*.vsix \
            --title "${{ github.ref_name }}" \
            --generate-notes
